[package]
name = "filmcraft-llm"
description = "FilmCraft local language model: the catalogue of small instruct models (pinned, checksummed, never bundled), the checked GGUF loader and guarded offline text generation with its own quantized forward pass (pure Rust, CPU, run-time SIMD dispatch)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Quantized (GGUF) inference on the CPU with our own forward pass (pure Rust, run-time SIMD
# dispatch; AI-PLAN AI1). Off by default and in wasm builds.
infer = ["dep:tokenizers", "dep:pulp", "dep:half", "dep:rayon", "dep:bytemuck"]
# GPU (wgpu) kernels for inference (AI3.3b); the CPU path stays the fallback. Backends come from
# the app (as for filmcraft-gpu); the tests enable them through the dev-dependency.
gpu = ["infer", "dep:wgpu", "dep:pollster", "dep:log"]
# Model downloads over HTTPS, through filmcraft-speech's verified downloader.
download = ["filmcraft-speech/download"]

[dependencies]
filmcraft-speech = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# Own quantized kernels (AI1.1): run-time SIMD dispatch, f16 scales.
pulp = { version = "0.22", optional = true }
half = { version = "2.7", optional = true }
rayon = { workspace = true, optional = true }
bytemuck = { version = "1", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
# The previous inference path, kept as the test oracle (and for the llm_quantize tool).
candle-core = { version = "0.9", default-features = false }
candle-transformers = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }

[[example]]
name = "llm_eval"
required-features = ["infer"]

[[example]]
name = "llm_quantize"
required-features = ["infer"]
