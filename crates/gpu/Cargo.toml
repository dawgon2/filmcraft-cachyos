[package]
name = "filmcraft-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The workspace lints, except `unsafe_code = "deny"` instead of `forbid`: the one module that
# imports decoder surfaces into Vulkan (`interop`, Linux) opts in with `#[allow(unsafe_code)]`
# (docs/adr/0002-linux-video-interop.md); every `unsafe` block there has a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-render = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
# u16 planes as upload bytes without a copy (safe casts)
bytemuck = "1"
log = { workspace = true }
rayon = { workspace = true }

# Vulkan device creation with DMA-BUF import and the import itself (`interop`).
[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan"] }

[dev-dependencies]
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmcraft-media = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-time = { workspace = true }
