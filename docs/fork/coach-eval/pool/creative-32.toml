[[question]]
id = "pool-cr32-matrix-lumetri"
kind = "creative"
family = "green-matrix-look"
q = "matrix green in lumetri"
sources = ["color.lumetri.panel", "practice.grading.split-tone"]
must = ["Lumetri's Color Wheels: shadows and midtones towards green, highlights a little less", "Creative saturation down slightly, contrast up"]
must_not = []
style = "premiere-words"

# --- sensor-dust-spot (admitted gap) ---

[[question]]
id = "pool-cr32-dust"
kind = "creative"
family = "sensor-dust-spot"
q = "there's a dust spot from my sensor in the sky of every shot, how do I remove it"
sources = ["tracking.follow", "practice.editing.clean-plate"]
must = ["no paint / clone (healing) tool yet", "a small Gaussian Blur inside a feathered mask over the spot (tracked if the camera moves)", "or a clean patch from a copy of the shot, offset and masked over it"]
must_not = ["a healing brush or clone tool in Revolution"]
style = "beginner"

[[question]]
id = "pool-cr32-dust-preset"
kind = "creative"
family = "sensor-dust-spot"
q = "same dust spot on 40 clips, fix them all at once"
sources = ["effects.presets", "tracking.follow"]
must = ["fix one clip (blur in a mask at the spot), save the effect with its mask as a preset (presets.save)", "apply to the others (presets.apply): mask positions come along; the spot is in the same place on the sensor"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr32-dust-busy"
kind = "creative"
family = "sensor-dust-spot"
q = "dust spot over a detailed background, blur shows"
sources = ["practice.editing.clean-plate", "effects.opacity"]
must = ["blur shows on detail: use a patch from a clean frame or a nearby clean area, masked and feathered over the spot", "Revolution has no content-aware fill; check frame by frame"]
must_not = []
style = "sloppy"
