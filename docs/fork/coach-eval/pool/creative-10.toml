# AI-POOL batch creative-10 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families: overlays, text effects and edit tricks. Ten new families: a new sky by
# keying, fire / sparks overlays, snow or rain (gap: no particles), flying 3-D text (gap: no 3-D), a
# lyric video, a before / after wipe, a zoom transition, Ken Burns on photos, bleeping a swear word,
# a news ticker. `must` = plan sub-goals from the guide's own text. Families with a gap: new-sky-key
# (no automatic sky replacement), snow-rain-overlay, flying-3d-text. Held-out only.

# --- new-sky-key ---

[[question]]
id = "pool-cr10-sky"
kind = "creative"
family = "new-sky-key"
q = "replace the boring grey sky with a sunset sky I have"
sources = ["keying.luma-color", "effects.opacity", "keying.check"]
must = ["no automatic sky replacement: key it by hand", "the shot on V2 with Color Key (a plain sky) or Luma Key (a bright sky) so the sky turns see-through, the sunset clip on V1 below", "soften the edge (Edge Feather) and match the foreground's grade to the new light"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr10-sky-moving"
kind = "creative"
family = "new-sky-key"
q = "sky replacement on a shot where the camera pans"
sources = ["keying.luma-color", "tracking.follow", "tracking.what"]
must = ["the key itself follows the colour, but the new sky must move with the pan: attach the sky layer to a track (tracking.attach) or keyframe its Position", "flat sky has nothing to track: track a detail on the horizon"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr10-sky-trees"
kind = "creative"
family = "new-sky-key"
q = "sky swap but the tree branches go see-through too"
sources = ["keying.luma-color", "effects.opacity", "keying.ultra-key"]
must = ["lower Color Tolerance so only the sky goes; or limit the key with a mask on Opacity", "Ultra Key's matte controls (Choke, Soften) give finer edges than Color Key"]
must_not = []
style = "sloppy"

# --- fire-sparks-overlay ---

[[question]]
id = "pool-cr10-fire"
kind = "creative"
family = "fire-sparks-overlay"
q = "add sparks flying in front of the welder, I have spark footage on black"
sources = ["effects.opacity", "practice.looks.double-exposure"]
must = ["the spark clip on a track above with Opacity Blend Mode Screen or Linear Dodge (Add): black disappears, only the sparks stay", "Motion Position / Scale to place them; a mask limits where they show"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr10-fire-glow"
kind = "creative"
family = "fire-sparks-overlay"
q = "campfire overlay should also light up the face a bit"
sources = ["effects.opacity", "color.recipes.face", "effects.stylize"]
must = ["the fire overlay on Screen above the shot", "a soft window on the face with a warm Gain push (keyframed flicker if wanted); Wonder Glow on the flames"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr10-fire-muzzle"
kind = "creative"
family = "fire-sparks-overlay"
q = "muzzle flash on a toy gun for a short film"
sources = ["effects.opacity", "tracking.follow", "effects.stylize"]
must = ["a flash overlay clip (on black) two or three frames long on Screen, positioned at the barrel (attach to track if the gun moves)", "a one-frame exposure bump (a Lumetri Exposure keyframe) on the shot; a sound effect on the same frame"]
must_not = []
style = "sloppy"

# --- snow-rain-overlay (gap: no particles) ---

[[question]]
id = "pool-cr10-snow"
kind = "creative"
family = "snow-rain-overlay"
q = "add falling snow to my winter shot"
sources = ["compositor.basics", "effects.opacity"]
must = ["no particle generator (the compositor has no particles)", "workaround: snow footage shot against black on a track above with a Screen blend", "a cool, slightly desaturated grade sells the cold"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr10-rain"
kind = "creative"
family = "snow-rain-overlay"
q = "fake rain on a window shot"
sources = ["effects.opacity", "compositor.basics", "effects.stylize"]
must = ["rain overlay footage on Screen above the shot; no particles built in", "Turbulent Displace at a low amount can fake water on glass; darker, cooler grade"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr10-snow-resolve"
kind = "creative"
family = "snow-rain-overlay"
q = "in fusion I'd use pEmitter for snow, what's the equivalent"
sources = ["compositor.basics", "effects.opacity"]
must = ["none yet: the compositor is a much smaller graph with no 3D, particles or scripting", "use stock snow / rain clips with a Screen or Add blend (a Merge node in a comp)"]
must_not = []
style = "resolve-words"

# --- flying-3d-text (gap: no 3-D) ---

[[question]]
id = "pool-cr10-3d"
kind = "creative"
family = "flying-3d-text"
q = "3D title that flies towards the camera"
sources = ["effects.shape-move", "graphics.text", "effects.keyframes"]
must = ["no extruded 3-D text or 3-D camera; 3D Rotate (Video Effects ▸ Transform: X / Y / Z Rotation, Perspective, Z Position) moves a flat title in perspective", "keyframe Z Position (or Scale) towards the camera with eased keyframes, Opacity and a little blur as it passes"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr10-3d-extrude"
kind = "creative"
family = "flying-3d-text"
q = "extruded metallic 3d logo spin intro"
sources = ["compositor.basics", "effects.shape-move", "media.import"]
must = ["no 3-D extrusion; the compositor has no 3D", "make the logo animation in a 3-D app and import it as a clip (with transparency), or spin the flat logo with 3D Rotate (Y Rotation, Hide Back Face)"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr10-3d-perspective"
kind = "creative"
family = "flying-3d-text"
q = "star wars style crawl text tilting back into space"
sources = ["graphics.responsive", "effects.shape-move", "tracking.screen"]
must = ["a text roll (graphics.setRoll) for the crawl", "the tilt: 3D Rotate's X Rotation with Perspective on the rolled title (or Corner Pin with the top corners closer together)"]
must_not = []
style = "sloppy"

