# --- before-after-wipe ---

[[question]]
id = "pool-cr10-before-after"
kind = "creative"
family = "before-after-wipe"
q = "a before and after of my colour grade with a line sweeping across"
sources = ["effects.opacity", "effects.keyframes", "color.matching.compare"]
must = ["the ungraded copy on V1 and the graded clip on V2 (or the other way)", "a rectangle mask on V2's Opacity whose position is keyframed across the frame", "the Color page's wipe compares while grading, but isn't rendered"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr10-before-after-split"
kind = "creative"
family = "before-after-wipe"
q = "side by side before after for my reel, same clip"
sources = ["effects.opacity", "effects.apply", "compositor.basics"]
must = ["two copies of the clip, one with the grade turned off, each masked to its half (or moved with Motion Position)", "a title on each side: before / after"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr10-before-after-bypass"
kind = "creative"
family = "before-after-wipe"
q = "quick before/after toggle to show a client while grading, not exported"
sources = ["color.matching.compare", "color.nodes.panel"]
must = ["switch the nodes off and on (the node's on / off) or compare with a still by wipe or split", "nothing is changed in the export"]
must_not = []
style = "pro"

# --- zoom-transition ---

[[question]]
id = "pool-cr10-zoom"
kind = "creative"
family = "zoom-transition"
q = "zoom transition where it zooms into one clip and out of the next"
sources = ["effects.stylize", "effects.transitions"]
must = ["the Cross Zoom transition (Video Transitions ▸ Lights & Blurs) on the edit", "it needs handles; its settings are in Effect Controls"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr10-zoom-hand"
kind = "creative"
family = "zoom-transition"
q = "smooth zoom-in transition I control myself, with motion blur"
sources = ["effects.keyframes", "practice.titles.shake", "practice.titles.easing"]
must = ["add the Transform effect, keyframe Scale up quickly into the cut on the first clip and down from large on the second", "Use Effect Shutter Angle for motion blur; eased keyframes"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr10-zoom-sound"
kind = "creative"
family = "zoom-transition"
q = "zoom transitions need a whoosh"
sources = ["effects.stylize", "essential-sound.types"]
must = ["Cross Zoom on the edits", "a whoosh sound effect on an SFX track lined up with each one"]
must_not = []
style = "sloppy"

# --- ken-burns-photos ---

[[question]]
id = "pool-cr10-kenburns"
kind = "creative"
family = "ken-burns-photos"
q = "slowly zoom and pan across old family photos for a slideshow"
sources = ["effects.keyframes", "media.import", "practice.titles.easing"]
must = ["import the photos; keyframe each clip's Motion Scale and Position from start to end", "eased keyframes so moves don't start and stop mechanically", "dissolves between photos"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr10-kenburns-preset"
kind = "creative"
family = "ken-burns-photos"
q = "same slow push on 80 photos without keyframing each one"
sources = ["effects.presets", "effects.keyframes"]
must = ["keyframe one, save the Motion as a preset with Scale keyframes (they stretch to each clip's length), apply it to the rest", "vary it on some so it isn't monotonous"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr10-kenburns-res"
kind = "creative"
family = "ken-burns-photos"
q = "photos look soft when zoomed in the slideshow"
sources = ["practice.youtube.punch-in", "media.clips"]
must = ["zooming past the photo's own resolution softens it: use larger originals or zoom less", "Scale to Frame Size fits a photo to the sequence first"]
must_not = []
style = "sloppy"

