# --- stop-motion-look ---

[[question]]
id = "pool-cr6-stopmo"
kind = "creative"
family = "stop-motion-look"
q = "make normal video look like choppy stop motion"
sources = ["effects.stylize", "media.clips"]
must = ["Posterize Time (Video Effects ▸ Time) with a low Frame Rate (e.g. 8–12)", "or by hand: cut every few frames and Frame Hold each piece (clip.frameHold)"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr6-stopmo-photos"
kind = "creative"
family = "stop-motion-look"
q = "real stop motion from 300 photos, each photo two frames"
sources = ["media.import", "media.clips"]
must = ["import the numbered stills as one image sequence", "Speed / Duration to 50 % (each photo shown for two frames) with frame sampling, not blending"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr6-stopmo-anime"
kind = "creative"
family = "stop-motion-look"
q = "on twos animation feel for a fight scene"
sources = ["effects.stylize", "media.clips"]
must = ["Posterize Time at half the sequence frame rate (12 for 24 fps)", "frame sampling, not frame blending, keeps the steps crisp"]
must_not = []
style = "sloppy"

# --- teal-orange-blockbuster ---

[[question]]
id = "pool-cr6-teal"
kind = "creative"
family = "teal-orange-blockbuster"
q = "the teal and orange blockbuster look"
sources = ["practice.grading.split-tone", "practice.grading.look-node", "practice.grading.qualify-skin"]
must = ["on a late look node: Lift slightly towards blue-cyan, Gain slightly towards orange", "protect skin with a qualifier when the push is strong; overdone, skin goes radioactive", "balance shots first, then copy the look node to the others (grade.append)"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr6-teal-lumetri"
kind = "creative"
family = "teal-orange-blockbuster"
q = "teal orange with lumetri shadow and highlight tint"
sources = ["color.lumetri.panel", "practice.grading.split-tone"]
must = ["Lumetri Color Wheels: Shadows wheel towards teal, Highlights towards orange, gently", "watch faces; a qualifier (HSL Secondary) can hold skin"]
must_not = []
style = "premiere-words"

[[question]]
id = "pool-cr6-teal-scene"
kind = "creative"
family = "teal-orange-blockbuster"
q = "same orange/teal grade on 80 shots but each needs its own balance"
sources = ["practice.grading.look-node", "practice.node-trees.fixed-tree", "color.matching.copy-paste"]
must = ["balance per shot on early nodes; the look on its own late node", "append the look node to every shot (grade.append); no shared nodes yet, so re-append after changing it"]
must_not = []
style = "pro"

