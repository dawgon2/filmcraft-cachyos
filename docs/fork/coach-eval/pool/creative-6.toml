sources = ["effects.stylize", "effects.opacity"]
must = ["Turbulent Displace (Video Effects ▸ Distort) warps the picture with moving noise; keep the amount small", "to limit it to the road: a copy of the clip with the effect on a track above, masked to the road on Opacity (masks.add), feathered"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr6-underwater"
kind = "creative"
family = "heat-haze-wobble"
q = "fake underwater look on a pool-side shot"
sources = ["effects.stylize", "color.recipes.cool", "color.primaries.panel"]
must = ["Turbulent Displace (Smoother mode) for the wobble", "grade it blue-green: Gain and Gamma towards cyan, less contrast, less saturation"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr6-dream-wobble"
kind = "creative"
family = "heat-haze-wobble"
q = "dream sequence where the picture wobbles in and out"
sources = ["effects.stylize", "effects.keyframes"]
must = ["Turbulent Displace on the clips (or an Adjustment Layer)", "keyframe its amount up at the start of the dream and back to 0 after"]
must_not = []
style = "pro"

# --- whip-pan-transition ---

[[question]]
id = "pool-cr6-whip"
kind = "creative"
family = "whip-pan-transition"
q = "a whip pan transition between two places"
sources = ["effects.stylize", "effects.transitions"]
must = ["the Whip transition (Video Transitions ▸ Slide ▸ Whip) on the edit: a whip pan with blur; direction and blur in Effect Controls", "it needs handles on both clips; keep it short"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr6-whip-real"
kind = "creative"
family = "whip-pan-transition"
q = "I shot real whip pans at the end and start of each shot, how do I join them seamlessly"
sources = ["editing.cutting", "effects.transitions", "practice.editing.cut-on-action"]
must = ["cut in the middle of the blurred whip on both shots so the motion hides the cut", "a very short dissolve (or the Whip transition) over the join if it still jumps"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr6-whip-travel"
kind = "creative"
family = "whip-pan-transition"
q = "travel vlog transitions swoosh between cities with a sound"
sources = ["effects.stylize", "effects.transitions", "essential-sound.types"]
must = ["Whip, Push or Slide transitions on the edits", "a whoosh sound effect on an SFX track lined up with each transition"]
must_not = []
style = "sloppy"

