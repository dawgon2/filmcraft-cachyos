# AI-POOL batch creative-6 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families, using the stylised effects and practice notes the main runner added for
# the creative set (effects.stylize, practice.editing.speed-ramp / stabilize). Ten new families: speed
# ramp, steadying a handheld shot, dreamy glow, heat haze / underwater wobble, whip pan, motion trails,
# stop-motion look, teal and orange, neon night city, matching two interview cameras. `must` = plan
# sub-goals from the guide's own text. Families with a gap: speed-ramp-action (no smooth ramps:
# stepped ramp), steady-handheld (2-D only: no rolling-shutter / parallax fix). Held-out only.

# --- speed-ramp-action ---

[[question]]
id = "pool-cr6-ramp"
kind = "creative"
family = "speed-ramp-action"
q = "speed up the run and then go slow motion right when he jumps"
sources = ["practice.editing.speed-ramp", "media.clips"]
must = ["cut at the start and end of the jump (sequence.addEdit); the middle piece slow with Speed / Duration (e.g. 30 %, Ripple on), the outer pieces faster", "Optical Flow (clip.setTimeInterpolation) for slow motion from normal-frame-rate footage", "no smooth speed ramps yet: Time Remapping keyframes don't change playback; the steps can be softened with a short dissolve"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr6-ramp-premiere"
kind = "creative"
family = "speed-ramp-action"
q = "I'd use time remapping keyframes in premiere for a smooth ramp, do they work here"
sources = ["practice.editing.speed-ramp", "media.clips"]
must = ["Time Remapping keyframes are kept (copied, imported) but don't change playback or export yet", "use a stepped ramp: Add Edit and a different Speed / Duration per piece"]
must_not = []
style = "premiere-words"

[[question]]
id = "pool-cr6-ramp-sound"
kind = "creative"
family = "speed-ramp-action"
q = "slow-mo moment in my skate edit but the audio goes weird during it"
sources = ["practice.editing.speed-ramp", "essential-sound.types", "practice.audio.ambience-beds"]
must = ["slowed pieces of sound sound wrong: put the music or a sound effect over the ramp instead", "high-frame-rate footage (50 / 60 / 120 fps) slows down cleanly; optical flow can warp fast moving wheels or arms"]
must_not = []
style = "sloppy"

# --- steady-handheld ---

[[question]]
id = "pool-cr6-stab"
kind = "creative"
family = "steady-handheld"
q = "my walking shot is really shaky, can I smooth it out"
sources = ["practice.editing.stabilize", "effects.apply"]
must = ["Warp Stabilizer (Video Effects ▸ Distort, effects.apply); it analyses the clip's camera motion first", "Result Smooth Motion keeps the walk but removes the shake (Smoothness); Framing Stabilize, Crop, Auto-scale hides the edges", "big auto-scale softens the picture; check Maximum Scale"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr6-stab-tripod"
kind = "creative"
family = "steady-handheld"
q = "make a handheld shot look like it was on a tripod then add a hit shake at the bang"
sources = ["practice.editing.stabilize", "practice.titles.shake", "effects.stylize"]
must = ["Warp Stabilizer with Result No Motion holds the frame still (crops more)", "stabilise first, then add the shake on top: the Camera Shake effect with its amounts keyframed for the hit, or keyframed Transform Position / Rotation"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr6-stab-jelly"
kind = "creative"
family = "steady-handheld"
q = "stabilised my phone clip but now it wobbles like jelly"
sources = ["practice.editing.stabilize", "effects.apply"]
must = ["Revolution's stabilizer is 2-D (position, scale, rotation): rolling-shutter jelly and strong parallax aren't corrected", "lower Smoothness if the frame floats"]
must_not = []
style = "sloppy"

# --- dreamy-glow ---

[[question]]
id = "pool-cr6-glow"
kind = "creative"
family = "dreamy-glow"
q = "soft dreamy glow on the highlights for a memory scene"
sources = ["effects.stylize", "practice.node-trees.glow", "practice.looks.pastel"]
must = ["Wonder Glow (Video Effects ▸ Lights & Glows): Threshold sets what blooms, Radius and Intensity how much", "a pastel base helps: Contrast down, blacks lifted, Saturation a little down, keep a clean white point"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr6-glow-halation"
kind = "creative"
family = "dreamy-glow"
q = "film halation red halo around bright edges"
sources = ["practice.node-trees.glow", "effects.stylize"]
must = ["no halation effect yet: Wonder Glow with a red-orange Glow Color, a high Threshold and a small Radius", "or a duplicate above with a high-luma key, Gaussian Blur and a Screen blend"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr6-glow-lamps"
kind = "creative"
family = "dreamy-glow"
q = "make the street lamps glow more in my night shot"
sources = ["effects.stylize", "practice.mixed-cameras.night-street"]
must = ["Wonder Glow with a high Threshold so only the lamps bloom", "keep city lights rich and skin natural; don't lift the noise"]
must_not = []
style = "sloppy"

# --- heat-haze-wobble ---

[[question]]
