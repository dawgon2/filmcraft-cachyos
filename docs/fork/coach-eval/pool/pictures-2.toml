# AI-POOL batch pictures-2 (FORK-PLAN §1a.87): more fact-sheet frames (mixed cameras, difficult light).
# Held-out slice: situations (LED + lamp, backlit, phone, two skin depths, wood vs skin) no picture pair uses.

[[question]]
id = "pool-pic2-led-tungsten"
kind = "picture"
facts = "Exposure: mids about 0.2 stops below middle grey; 0% clipped highlights, 0% crushed blacks; contrast 4.8 stops (5–95 %).\nWhite balance: near-neutral areas (23% of the frame) look warm (towards orange), slightly magenta tint, about 3000 K.\nSaturation: moderate.\nSkin-tone colours (faces, or any warm surface): 11% of the frame, about 9° towards yellow from the skin line."
q = "interview lit with a cheap LED and a lamp, what's wrong?"
sources = ["color.primaries.white-balance", "practice.grading.balance-first"]
must = ["neutrals read warm with a magenta tint", "balance on the first node with the WB picker (grade.wb.pick): Temperature and Tint move together"]
must_not = []
style = "beginner"
needs_clip = true

[[question]]
