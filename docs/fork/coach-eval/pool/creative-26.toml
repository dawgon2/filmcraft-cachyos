sources = ["tracking.follow", "graphics.layers"]
must = ["an ellipse shape graphic on the track above", "tracking.attach so it follows the player"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr26-spot-freeze"
kind = "creative"
family = "player-spotlight"
