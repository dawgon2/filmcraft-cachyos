must_not = []
style = "pro"

# --- title-blur-in ---

[[question]]
id = "pool-cr26-blurtitle"
kind = "creative"
family = "title-blur-in"
q = "title that starts blurry and comes into focus"
sources = ["effects.keyframes", "graphics.text", "practice.titles.easing"]
must = ["Gaussian Blur on the title clip with Blurriness keyframed from high to 0", "Opacity keyframed up at the same time, eased keyframes"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr26-blurtitle-out"
kind = "creative"
family = "title-blur-in"
q = "blur in, hold, blur out for every chapter title, same each time"
sources = ["effects.keyframes", "effects.presets", "practice.titles.in-out"]
must = ["blur and opacity keyframes for the entrance and a matching exit", "saved as a preset (presets.save) with Anchor to In Point / Out Point so it fits any length"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr26-blurtitle-dir"
kind = "creative"
family = "title-blur-in"
q = "text slides in with a sideways motion blur streak"
sources = ["effects.keyframes", "effects.apply", "practice.titles.easing"]
must = ["Position keyframes for the slide with Ease Out", "Directional Blur (or Gaussian Blur with Blur Dimensions Horizontal) keyframed down to 0 as it lands"]
must_not = []
style = "sloppy"

# --- radio-dj-voice ---

[[question]]
id = "pool-cr26-radio"
kind = "creative"
family = "radio-dj-voice"
q = "make my voice sound like a radio DJ"
sources = ["essential-sound.presets", "essential-sound.controls"]
must = ["type the clip Dialogue and apply the Radio Announcer preset (essentialSound.applyPreset)", "adjust Dynamics and the EQ (Radio Voice) amount to taste"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr26-radio-old"
kind = "creative"
family = "radio-dj-voice"
q = "old AM radio broadcast sound, thin and boxy"
sources = ["essential-sound.controls", "essential-sound.presets"]
must = ["the EQ preset Telephone or Radio Voice at a high amount for a narrow band", "Reduce Rumble up so the lows go; a little noise underneath sells it"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr26-radio-podcast"
kind = "creative"
family = "radio-dj-voice"
q = "big, close, compressed broadcast voice for a podcast intro"
sources = ["practice.audio.voice-compression", "essential-sound.controls", "essential-sound.presets"]
must = ["a compressor on the voice (Dynamics), moderate ratio", "EQ Warm Voice or Presence Lift; Radio Announcer as a starting preset"]
must_not = []
style = "pro"

# --- player-spotlight ---

[[question]]
id = "pool-cr26-spot"
