kind = "creative"
family = "vignette-focus"
q = "vignette that follows the subject as she walks across"
sources = ["practice.grading.vignette", "color.secondaries.tracking"]
must = ["an inverted soft ellipse window on its own node", "track the window so it follows her"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr7-vignette-spotlight"
kind = "creative"
family = "vignette-focus"
q = "stage spotlight look, everything dark except a pool of light on the singer"
sources = ["practice.looks.low-key", "practice.grading.vignette", "color.secondaries.windows"]
