must_not = []
style = "sloppy"

# --- archive-in-new-film ---

[[question]]
id = "pool-cr7-archive"
kind = "creative"
family = "archive-in-new-film"
q = "mixing old 90s camcorder tapes into my new documentary"
sources = ["practice.mixed-cameras.archival", "file-menu.clip-video"]
must = ["interlaced sources: Field Options (clip.fieldOptions) to deinterlace; Fit to frame for old aspect ratios (clip.fitToFrame)", "balance gently and keep its age; match only brightness and contrast to the new footage", "making old video look new looks fake"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr7-archive-43"
kind = "creative"
family = "archive-in-new-film"
q = "old 4:3 clips in a 16:9 timeline, fill or bars?"
sources = ["practice.mixed-cameras.archival", "file-menu.clip-video", "media.clips"]
must = ["Fit (pillarbox bars, the whole picture) or Fill (crops the top and bottom, softer); Scale to Frame Size", "trade-off: filling crops and enlarges low-resolution footage"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr7-archive-new-old"
kind = "creative"
family = "archive-in-new-film"
q = "make the new reenactment shots blend with real archive footage from the 70s"
sources = ["practice.looks.faded-blacks", "practice.mixed-cameras.archival", "color.finishing.grain"]
must = ["age the new shots towards the archive: faded blacks, lower saturation, grain", "match brightness and contrast between them rather than cleaning up the archive"]
must_not = []
style = "pro"

# --- podcast-to-shorts ---

[[question]]
id = "pool-cr7-shorts"
kind = "creative"
family = "podcast-to-shorts"
q = "turn the best minute of my podcast video into a vertical short with captions"
sources = ["practice.delivery.vertical", "practice.youtube.vertical-captions", "text.transcripts"]
must = ["a vertical sequence (1080 × 1920) with the minute, each clip repositioned with Motion Position or Auto Reframe (Target Aspect Vertical 9:16)", "captions from the transcript (transcript.createCaptions, short maxChars, one line), styled big with a stroke (captions.setStyle), burned in at export", "keep captions in the middle third, away from the buttons"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr7-shorts-two"
kind = "creative"
family = "podcast-to-shorts"
q = "two-person podcast, vertical short that shows whoever is talking"
sources = ["editing.multicam", "practice.delivery.vertical", "trimming.multicam"]
must = ["a multicam of the two cameras, angle cuts to whoever talks", "in a vertical sequence, repositioned so each speaker is centred"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr7-shorts-find"
kind = "creative"
family = "podcast-to-shorts"
q = "find good clips in a 2 hour podcast fast"
sources = ["text.transcripts", "timeline.markers", "practice.editing.selects"]
must = ["transcribe and search the text for the moments; cut by selecting words", "mark the good moments (markers) in one watch-through"]
must_not = []
style = "sloppy"

# --- reaction-pip ---

[[question]]
id = "pool-cr7-pip"
kind = "creative"
family = "reaction-pip"
q = "reaction video with my face in a small box in the corner over the clip"
sources = ["effects.apply", "practice.titles.safe-margins", "effects.opacity"]
must = ["the clip on V1, the face cam on V2 with Motion Scale down (e.g. 30 %) and Position in a corner, inside the safe margins", "a mask on Opacity can crop the box (rectangle or ellipse for a round cam)"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr7-pip-border"
kind = "creative"
family = "reaction-pip"
q = "picture in picture with a border and rounded corners in a comp"
sources = ["compositor.basics", "compositor.masks"]
must = ["a comp: the face cam through a Transform node (scale, position) and a Mask node, merged over the main clip", "a slightly bigger Solid behind it, masked the same way, makes a border"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr7-pip-sync"
kind = "creative"
family = "reaction-pip"
q = "my webcam and the game footage are out of sync for the PIP"
sources = ["media.clips", "practice.editing.sync-sound"]
must = ["Synchronize (clip.synchronize) by audio lines up the webcam with the game capture", "or slip one clip by frames until a clap / sound lines up"]
must_not = []
style = "sloppy"
