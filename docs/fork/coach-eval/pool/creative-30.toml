sources = ["practice.looks.vhs", "color.finishing.grain", "mixing.inserts"]
must = ["a soft, warm, slightly faded grade with grain on the last node (or the VHS shader effect)", "the music track's highs cut with an EQ / lowpass insert (mixer.addInsert)"]
