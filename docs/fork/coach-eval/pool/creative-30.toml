must = ["very short Glitch or VHS Damage transitions on each cut (sequence.applyVideoTransition)", "a click / static sound typed SFX on each change"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr30-channel-tv"
kind = "creative"
family = "channel-surf-transition"
q = "channel surfing shown on an old TV in the room"
sources = ["tracking.screen", "media.clips", "effects.transitions"]
must = ["the channel-surf sequence nested and pinned onto the TV screen with Corner Pin (Track Surface)", "the glitch cuts inside the nest"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr30-channel-static"
kind = "creative"
family = "channel-surf-transition"
q = "few frames of tv static between each channel"
sources = ["shader-effects.use", "editing.cutting"]
