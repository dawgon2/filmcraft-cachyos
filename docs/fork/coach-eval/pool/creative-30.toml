sources = ["editing.cutting", "effects.transitions"]
must = ["a short clip repeated end to end, cut where the motion matches, with short dissolves to hide the joins", "the music laid as one long track; the export covers the whole length"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr30-lofi-crackle"
kind = "creative"
family = "lofi-music-look"
q = "vinyl crackle under the beat"
sources = ["essential-sound.types", "practice.audio.ambience-beds"]
must = ["a crackle recording on its own track under the music, typed SFX or Ambience", "low in level, continuous across the cuts"]
must_not = []
style = "pro"

# --- dramatic-zoom-meme ---

[[question]]
id = "pool-cr30-meme"
kind = "creative"
family = "dramatic-zoom-meme"
q = "that meme where it zooms in fast on someone's face with a dun dun dun sound"
sources = ["effects.keyframes", "essential-sound.types", "practice.youtube.punch-in"]
must = ["Motion Scale (and Position on the face) keyframed with Hold steps, or cut to punch-ins at 100 / 150 / 200 %", "the sting sound typed SFX on the jumps"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr30-meme-shake"
kind = "creative"
family = "dramatic-zoom-meme"
q = "dramatic zoom with a shake and a red tint on the last hit"
sources = ["practice.titles.shake", "media.generated", "effects.opacity"]
must = ["Camera Shake for a few frames on the last zoom", "a red tint on that part: a red Color Matte (file.newColorMatte) above it with a blend mode such as Multiply"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr30-meme-preset"
kind = "creative"
family = "dramatic-zoom-meme"
q = "make the zoom-in meme reusable on any clip"
sources = ["effects.presets", "effects.keyframes"]
must = ["save the Motion keyframes as a preset with Anchor to In Point (presets.save)", "apply it (presets.apply) and recentre Position on the face"]
must_not = []
style = "pro"

# --- channel-surf-transition ---

[[question]]
id = "pool-cr30-channel"
kind = "creative"
family = "channel-surf-transition"
q = "flick between clips like changing TV channels"
