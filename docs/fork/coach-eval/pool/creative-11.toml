# AI-POOL batch creative-11 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families: whole small jobs people bring (a wedding highlight, a house tour, a
# recipe video) and a few tricks. Ten new families: wedding highlight, real-estate tour, overhead
# recipe video, gaming montage, a screen-recording tutorial, a sports replay with an arrow, flashes on
# the beat, a vertical phone clip in a wide video, a memorial slideshow, a recorded lecture with
# slides. `must` = plan sub-goals from the guide's own text. No admitted-gap family. Held-out only.

# --- wedding-highlight ---

[[question]]
id = "pool-cr11-wedding"
kind = "creative"
family = "wedding-highlight"
q = "turn 6 hours of wedding footage into a 3 minute highlight video"
sources = ["practice.editing.selects", "practice.editing.music-beat", "essential-sound.remix"]
must = ["selects first: watch once, mark the best moments (markers, subclips), be strict", "fit the song to about three minutes with Remix and cut on its phrases (markers on the beats, Snap)", "a warm, gentle grade across all shots"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr11-wedding-vows"
kind = "creative"
family = "wedding-highlight"
q = "wedding edit: music, but drop to the vows audio for the emotional part"
sources = ["essential-sound.ducking", "practice.audio.music-under-dialogue", "practice.editing.j-l-cuts"]
must = ["the vows typed Dialogue, the song Music with Ducking so it dips under them", "let the vows' audio start a little before their picture (J-cut)"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr11-wedding-cams"
kind = "creative"
family = "wedding-highlight"
q = "ceremony shot on 2 cameras and a separate audio recorder, put it together"
sources = ["practice.editing.sync-sound", "editing.multicam", "practice.mixed-cameras.interview"]
must = ["sync both cameras and the recorder by waveform, make a multicam", "match the two cameras' colour (skin first) before or on the angles"]
must_not = []
style = "sloppy"

# --- real-estate-tour ---

[[question]]
id = "pool-cr11-house"
kind = "creative"
family = "real-estate-tour"
q = "house tour video where the windows are blown out and the walk is wobbly"
sources = ["practice.editing.stabilize", "practice.mixed-cameras.overexposed", "practice.mixed-cameras.mixed-light"]
must = ["Warp Stabilizer (Smooth Motion) for the walk-through", "soft clip / curve shoulder for the windows; clipped window areas can't be recovered", "balance for the main light; treat the other light source with a window or qualifier"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr11-house-titles"
kind = "creative"
family = "real-estate-tour"
q = "room names popping up as we walk through each room"
sources = ["graphics.templates", "practice.titles.in-out", "practice.titles.lower-third"]
must = ["one lower-third template with the room name editable, applied at each room", "a matching in and out animation"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr11-house-vertical"
kind = "creative"
family = "real-estate-tour"
q = "need the house tour as a horizontal for the website and vertical for instagram reels"
sources = ["practice.delivery.vertical", "practice.youtube.batch-export"]
must = ["duplicate the sequence at 1080 × 1920 and reposition clips", "queue both exports in the export queue"]
must_not = []
style = "pro"

# --- overhead-recipe ---

[[question]]
id = "pool-cr11-recipe"
kind = "creative"
family = "overhead-recipe"
q = "overhead cooking video, speed up the boring stirring and label the ingredients"
sources = ["media.clips", "practice.titles.callouts", "graphics.text"]
must = ["cut the long stirring and speed it up with Speed / Duration (Ripple on)", "ingredient labels as text graphics; Attach to Track keeps a label on a moving bowl"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr11-recipe-punch"
kind = "creative"
family = "overhead-recipe"
q = "one overhead 4K camera but I want close-ups of the chopping too"
sources = ["practice.youtube.punch-in", "practice.youtube.pattern-interrupt"]
must = ["punch in with Motion Scale and Position on a 1080p sequence (or 6.2K in 4K)", "alternate wide and punch-in to keep it moving"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr11-recipe-food"
kind = "creative"
family = "overhead-recipe"
q = "food looks dull and bluish under my kitchen lights"
sources = ["color.recipes.warm", "practice.looks.commercial", "color.primaries.white-balance"]
must = ["balance first (pick something white, like a plate), then warm it a little", "clean, slightly saturated: white point near the top, gentle contrast"]
must_not = []
style = "pro"

# --- gaming-montage ---

[[question]]
id = "pool-cr11-gaming"
kind = "creative"
family = "gaming-montage"
q = "gaming montage with glitchy transitions synced to the beat"
sources = ["effects.stylize", "practice.editing.music-beat", "practice.youtube.screen-recordings"]
must = ["markers on the beats, cuts snapped to them", "Glitch or VHS Damage transitions on some edits (Video Transitions ▸ Grunge & Distort)", "a sequence at the capture's frame rate so motion stays smooth"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr11-gaming-facecam"
kind = "creative"
family = "gaming-montage"
q = "gameplay with my facecam in the corner and my mic voice clean"
sources = ["effects.apply", "audio.cleanup-voice", "media.clips"]
must = ["facecam on V2, Motion Scale down and Position in a corner", "Clean Up Voice on the mic track", "sync facecam and game capture by audio (clip.synchronize)"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr11-gaming-vfr"
kind = "creative"
family = "gaming-montage"
q = "OBS recording drifts out of sync over 20 minutes"
sources = ["practice.youtube.screen-recordings", "media.clips"]
must = ["variable-frame-rate recordings drift: record at a constant frame rate", "for now, cut and re-sync the audio in sections (clip.synchronize or slip)"]
must_not = []
style = "pro"

# --- screen-tutorial ---

[[question]]
id = "pool-cr11-tutorial"
