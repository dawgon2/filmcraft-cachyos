must_not = []
style = "pro"

# --- sports-replay ---

[[question]]
id = "pool-cr11-replay"
kind = "creative"
family = "sports-replay"
q = "slow motion replay of the goal with an arrow on the scorer"
sources = ["practice.editing.speed-ramp", "practice.titles.callouts", "tracking.follow"]
must = ["copy the moment after the live action and set it slower (Speed / Duration, Optical Flow)", "an arrow graphic attached to the player with Attach to Track (Position only)"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr11-replay-freeze"
kind = "creative"
family = "sports-replay"
q = "freeze on the pass and draw the run on the frame, then play on"
sources = ["file-menu.clip-video", "graphics.layers", "effects.keyframes"]
must = ["Insert Frame Hold Segment (clip.insertFrameHoldSegment) at the moment", "shape layers (lines, circles) in a graphic over the hold, animated on, then the play continues"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr11-replay-spot"
kind = "creative"
family = "sports-replay"
q = "spotlight one player and darken the rest during the replay"
sources = ["practice.grading.vignette", "color.secondaries.tracking"]
must = ["an inverted soft ellipse window on the player with Gain down outside", "track the window so it follows the player"]
must_not = []
style = "sloppy"

# --- beat-flashes ---

[[question]]
id = "pool-cr11-flash"
kind = "creative"
family = "beat-flashes"
q = "white flashes on every beat drop of the song"
sources = ["practice.editing.music-beat", "effects.transitions", "effects.keyframes"]
must = ["markers on the drops (M while playing)", "a short Dip to White on the cut at each drop, or an Exposure keyframe bump over a couple of frames"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr11-flash-strobe"
kind = "creative"
family = "beat-flashes"
q = "strobe light party effect for the dance part"
sources = ["effects.stylize", "effects.keyframes"]
must = ["Posterize Time at a low frame rate gives a stuttering strobe feel", "brightness bumps keyframed on the beats; keep flashing gentle and short (flashing can trouble some viewers)"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr11-flash-preset"
kind = "creative"
family = "beat-flashes"
q = "same 3-frame flash on 40 beats, fastest way"
sources = ["effects.presets", "timeline.markers"]
must = ["build the flash once, save it as a preset (presets.save, keyframes anchored to the In point), apply it at each marker", "or one adjustment layer clip copied to each marker"]
must_not = []
style = "pro"

# --- vertical-in-horizontal ---

[[question]]
id = "pool-cr11-vert-fill"
kind = "creative"
family = "vertical-in-horizontal"
q = "vertical phone video in my 16:9 edit with the blurry background instead of black bars"
sources = ["file-menu.clip-video", "effects.apply", "effects.opacity"]
must = ["two copies: the lower one Fill frame (clip.fillFrame) with Gaussian Blur, the upper one Fit to frame (clip.fitToFrame)", "darken or desaturate the blurred copy a little so the sharp one stands out"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr11-vert-fill-many"
kind = "creative"
family = "vertical-in-horizontal"
q = "blurred-background treatment on 30 vertical clips"
sources = ["effects.presets", "file-menu.clip-video", "compositor.basics"]
must = ["save the blur + scale setup as a preset and apply it to the background copies", "or one comp (Media In → Blur behind a fitted Media In) reused per clip"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr11-vert-fill-sloppy"
kind = "creative"
family = "vertical-in-horizontal"
q = "tiktok clip in youtube video black sides ugly"
sources = ["file-menu.clip-video", "effects.apply"]
must = ["fill the sides with a blurred, enlarged copy of the same clip behind it (Fill frame + Gaussian Blur)", "the original on top, Fit to frame"]
must_not = []
style = "sloppy"

