must = ["shape layers (arrows, boxes) in a graphic clip over the recording", "or darken everything except the button: a dimmed copy with an inverted rectangle mask"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr11-tutorial-voice"
kind = "creative"
family = "screen-tutorial"
q = "record the voiceover after the screen capture and cut out the ums"
sources = ["audio.voiceover-record", "text.cleanup", "audio.cleanup-voice"]
