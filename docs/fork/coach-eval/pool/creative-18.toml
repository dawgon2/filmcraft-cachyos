sources = ["tracking.screen", "graphics.text", "effects.opacity"]
must = ["the title graphic on V2 with Corner Pin set to an area of the wall, Track Surface follows the camera move", "a blend mode (Multiply / Overlay) lets the wall's texture through"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr18-wall-floor"
kind = "creative"
family = "text-on-wall"
q = "chapter title lying on the floor in perspective"
sources = ["tracking.screen", "effects.shape-move"]
must = ["Corner Pin the title onto the floor area (track it if the camera moves)", "or 3D Rotate with X Rotation and Perspective for a static shot"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr18-wall-shadow"
kind = "creative"
family = "text-on-wall"
q = "text on the wall should get covered when someone walks in front"
sources = ["tracking.screen", "effects.opacity", "tracking.what"]
must = ["the pinned text under a copy of the shot masked to the person (tracked mask), so they pass in front", "Corner Pin's track survives the person crossing one corner"]
must_not = []
style = "sloppy"
