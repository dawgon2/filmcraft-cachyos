family = "cinematic-letterbox"
q = "2.39 bars cut off heads in some shots"
sources = ["effects.apply", "practice.delivery.vertical"]
must = ["reposition each shot under the bars with Motion Position", "open-gate footage leaves room to reframe"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr8-bars-pro"
kind = "creative"
family = "cinematic-letterbox"
q = "baked-in letterbox matte vs a true 2.39 deliverable"
sources = ["edit-menu.sequence-settings", "media.generated", "practice.delivery.master"]
must = ["a true wide deliverable: a sequence at that frame size (sequence.settings)", "a matte over 16:9 keeps a 16:9 file with black bars: easy on platforms, but the bars are encoded"]
must_not = []
style = "pro"

