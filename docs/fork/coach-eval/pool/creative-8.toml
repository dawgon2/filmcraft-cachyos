sources = ["editing.multicam", "practice.editing.sync-sound", "media.clips"]
must = ["sync the desk recording with the cameras by waveform (clip.synchronize by audio, or Merge Clips)", "use the desk audio for the whole sequence rather than following the camera angles"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr8-concert-keys"
kind = "creative"
family = "concert-multicam"
q = "switch camera angles with number keys while it plays"
sources = ["trimming.multicam", "command-reference.multicam"]
must = ["in the multicam monitor, the camera number keys cut to that angle while playing (switching or cutting by number)", "page through cameras when there are more than the grid shows"]
must_not = []
style = "sloppy"

# --- match-cut ---

[[question]]
id = "pool-cr8-matchcut"
kind = "creative"
family = "match-cut"
q = "match cut from a spinning coin to a spinning planet"
sources = ["practice.editing.cut-on-action", "effects.opacity", "effects.apply"]
must = ["cut at the same moment of the motion in both shots; fine-tune frame by frame with a rolling edit", "line the shapes up: lower the top clip's Opacity temporarily to see both, then Motion Position / Scale to match"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr8-matchcut-door"
kind = "creative"
family = "match-cut"
q = "cut as she opens the door so she steps out somewhere else"
sources = ["practice.editing.cut-on-action", "editing.trimming"]
must = ["cut in the middle of the movement so the cut hides in the motion", "roll the edit frame by frame (tool.rolling, trim.forward / backward); mismatched hands or positions break it"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr8-matchcut-sound"
kind = "creative"
family = "match-cut"
q = "sound match cut, scream turns into a train whistle"
sources = ["practice.editing.j-l-cuts", "practice.audio.crossfades"]
must = ["the scream's audio leads into the whistle: overlap the sounds with a short crossfade at the cut", "the picture cut sits on the sound change (split the audio and video edits)"]
must_not = []
style = "sloppy"

# --- cinematic-letterbox ---

[[question]]
id = "pool-cr8-bars"
