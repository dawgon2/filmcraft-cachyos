# AI-POOL batch creative-8 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families, weighted to editing craft, subtitles and voice. Ten new families: sound
# leading into a scene (J-cut), hiding interview cuts, silent gaps in dialogue, a concert multicam,
# a match cut, cinematic letterbox bars, an old-film countdown intro, subtitles in two languages, an
# AI narration draft, recording my own voice-over. `must` = plan sub-goals from the guide's own text.
# No admitted-gap family in this batch. Held-out only.

# --- sound-leads-scene ---

[[question]]
id = "pool-cr8-jcut"
kind = "creative"
family = "sound-leads-scene"
q = "hear the next scene's sound before we see it, like in movies"
sources = ["practice.editing.j-l-cuts", "timeline.in-out"]
must = ["a J-cut: the next clip's audio starts before its picture", "trim only the audio side of the edit with linked selection off (sequence.linkedSelection), or set split In / Out in the Source monitor (markers.markSplitAudioIn and pairs)", "keep sync afterwards: move a clip's audio and video together"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr8-lcut"
kind = "creative"
family = "sound-leads-scene"
q = "keep her voice going while we cut to his reaction"
sources = ["practice.editing.j-l-cuts", "editing.trimming"]
must = ["an L-cut: the picture cuts to the reaction while the audio carries on", "with linked selection off, roll only the video side of the edit earlier"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr8-split-source"
kind = "creative"
family = "sound-leads-scene"
q = "set up split edits from the source monitor before cutting them in"
sources = ["timeline.in-out", "trimming.source-monitor", "practice.editing.j-l-cuts"]
must = ["set separate audio and video In / Out in the Source monitor (markers.markSplitAudioIn, markSplitVideoOut and pairs)", "then Insert or Overwrite places the J / L cut directly"]
must_not = []
style = "pro"

# --- hide-interview-cuts ---

[[question]]
id = "pool-cr8-broll"
kind = "creative"
family = "hide-interview-cuts"
q = "I cut bits out of my interview and you can see the jumps, how do I hide them"
sources = ["practice.editing.b-roll", "timeline.targeting", "practice.editing.jump-cuts"]
must = ["B-roll on V2 over the cuts, video only, while the voice continues on A1", "target V2 and turn off source audio (timeline.setTargeting), then Overwrite (source.overwrite)", "or punch in on alternate cuts; pick B-roll that shows what's said"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr8-broll-morph"
kind = "creative"
family = "hide-interview-cuts"
q = "smooth out a jump cut in a talking head without b-roll"
sources = ["practice.editing.jump-cuts", "effects.transitions", "practice.youtube.pattern-interrupt"]
must = ["a punch-in (Motion Scale 110–120 %) on the second part softens the jump", "or a very short dissolve on the edit; vary the device so the jumps don't feel nervous"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr8-broll-sloppy"
kind = "creative"
family = "hide-interview-cuts"
q = "b roll over interview without killing the interview audio"
sources = ["practice.editing.b-roll", "timeline.targeting"]
must = ["place B-roll video only on V2: turn off source audio patching (timeline.setTargeting) before Overwrite", "the interview stays on V1 / A1"]
must_not = []
style = "sloppy"

# --- silent-gaps-dialogue ---

[[question]]
id = "pool-cr8-roomtone"
kind = "creative"
family = "silent-gaps-dialogue"
q = "when I cut out bits of dialogue the background noise drops to silence and it sounds weird"
sources = ["practice.editing.room-tone", "essential-sound.types", "practice.audio.crossfades"]
must = ["lay room tone on its own audio track under the gaps, typed Ambience", "short crossfades at the edits (sequence.applyAudioTransition)", "room tone from the same location: record it on set"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr8-roomtone-none"
kind = "creative"
family = "silent-gaps-dialogue"
q = "forgot to record room tone, where do I get some"
sources = ["practice.editing.room-tone", "practice.audio.ambience-beds", "media.clips"]
must = ["copy a few seconds of quiet between lines from the same recording and loop it under the gaps", "room tone from another location changes the colour of the noise"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr8-roomtone-pro"
kind = "creative"
family = "silent-gaps-dialogue"
q = "dialogue edit: fill, ambience bed, crossfades — what's the Revolution way"
sources = ["practice.editing.room-tone", "practice.audio.ambience-beds", "practice.audio.crossfades"]
must = ["a continuous ambience bed under the scene, room tone on its own track", "a few frames of crossfade on every audio cut; long ones on dialogue make words overlap"]
must_not = []
style = "pro"

# --- concert-multicam ---

[[question]]
id = "pool-cr8-concert"
kind = "creative"
family = "concert-multicam"
q = "I filmed a concert with three cameras, how do I cut between them"
sources = ["editing.multicam", "trimming.multicam", "practice.editing.sync-sound"]
must = ["sync the angles by their audio and make a multicam clip", "play it and cut between angles live in the multicam monitor; audio follows one source", "fix cuts afterwards like any edit"]
