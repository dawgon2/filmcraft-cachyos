[[question]]
id = "pool-e2-match-frame"
kind = "tool"
q = "find the original clip of this shot at the same frame"
sources = ["edit-menu.helpers"]
must = ["Match Frame (sequence.matchFrame) opens the source at the same frame in the Source monitor", "Reverse Match Frame goes the other way"]
must_not = []
