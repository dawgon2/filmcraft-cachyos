must = ["choose the grid (multicam.gridLayout) and step through pages (multicam.page, nextPage, prevPage)", "multicam.autoAdjustQuality lowers preview quality so many angles play smoothly"]
must_not = []
style = "beginner"

[[question]]
id = "pool-e2-rename-angles"
kind = "tool"
q = "can I rename the multicam angles or turn one off?"
sources = ["trimming.multicam"]
must = ["Edit Cameras… (multicam.editCameras)"]
