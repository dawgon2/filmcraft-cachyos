# AI-POOL batch editing-2: trimming.md, edit-menu.md, file-menu.md.
# Held-out test questions (README.md beside this file). Written from the guide's text.

# ---------- advanced format ----------

[[question]]
id = "pool-e2-select-nearest"
kind = "tool"
q = "how do I grab the edit point nearest the playhead without clicking?"
sources = ["trimming.edit-points"]
must = ["Select Nearest Edit Point (trim.selectNearest) on the targeted tracks"]
must_not = []
style = "beginner"

[[question]]
id = "pool-e2-multi-edit"
kind = "pro-practice"
q = "can I trim the edits on several tracks at the same time?"
sources = ["trimming.edit-points"]
must = ["yes: several edit points can be selected to trim tracks together (trim.selectEditPoint)"]
must_not = []
style = "pro"

[[question]]
id = "pool-e2-trim-end-gap"
kind = "approach"
q = "I want to cut the end of a clip to the playhead but the music on other tracks must not move"
sources = ["trimming.to-playhead"]
must = ["Trim Next Edit to Playhead (trim.next) leaves a gap instead of rippling", "ripple versions shift everything after the edit"]
must_not = []
style = "pro"

[[question]]
id = "pool-e2-extend-edit"
kind = "tool"
q = "move the cut to where the playhead is"
sources = ["trimming.to-playhead"]
must = ["Extend Selected Edit to Playhead (trim.extendToPlayhead)", "Extend Previous / Next Edit to Playhead without selecting first"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-e2-play-around"
kind = "tool"
q = "how do I watch a few seconds either side of a cut to judge it?"
sources = ["trimming.dynamic"]
must = ["Play Around Edit (trim.playAround)"]
must_not = []
style = "beginner"

[[question]]
id = "pool-e2-cancel-dynamic"
kind = "tweak"
q = "I was trimming with L and went too far, can I throw that away?"
sources = ["trimming.dynamic"]
must = ["trim.cancelDynamic throws the dynamic trim away", "or undo"]
must_not = []
style = "beginner"

[[question]]
id = "pool-e2-source-close"
kind = "tool"
q = "the Source monitor has a pile of clips loaded, how do I clear them?"
sources = ["trimming.source-monitor"]
must = ["close one (source.close) or all (source.closeAll)"]
must_not = []
style = "beginner"

[[question]]
id = "pool-e2-audio-follows"
kind = "approach"
