# AI-POOL batch creative-14 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families: tricks and genre pieces. Ten new families: picture pulsing to the music
# (gap: nothing reacts to audio), a hyperlapse walk, an unboxing with crisp sound, comic speech
# bubbles, a glowing outline round a dancer (partial gap: no automatic cut-out), a silent-film look,
# an invisibility cloak, vanishing in a flash, a dolly-zoom (partial: faked), a split two-tone grade.
# `must` = plan sub-goals from the guide's own text. Held-out only.

# --- music-reactive-pulse (gap) ---

[[question]]
id = "pool-cr14-pulse"
kind = "creative"
family = "music-reactive-pulse"
q = "make the video pulse and flash with the bass of the song automatically"
sources = ["shader-effects.recipes", "timeline.markers", "effects.keyframes"]
must = ["nothing in Revolution reacts to the audio yet", "by hand: markers on the beats (M while playing), then brightness or Scale keyframes on each", "the Pulse shader recipe pulses at a steady rate set in pulses per second, not from the sound: set it to the song's tempo"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr14-pulse-bpm"
kind = "creative"
family = "music-reactive-pulse"
q = "120 bpm track, I want a zoom bump on every beat"
sources = ["shader-effects.recipes", "effects.presets", "timeline.markers"]
must = ["120 bpm = 2 beats a second: the Pulse shader at 2 pulses per second gives a steady brightness beat (it uses time)", "for Scale bumps: make one bump, save it as a preset, apply at each beat marker"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr14-pulse-viz"
kind = "creative"
family = "music-reactive-pulse"
q = "audio spectrum visualizer bars for my music upload"
sources = ["shader-effects.write", "compositor.basics"]
must = ["no audio visualiser: effects and shaders don't read the sound", "make the visualiser elsewhere and import it, or use a still with the song"]
must_not = []
style = "sloppy"

# --- hyperlapse-walk ---

[[question]]
id = "pool-cr14-hyperlapse"
kind = "creative"
family = "hyperlapse-walk"
q = "turn my 10 minute walk through the city into a smooth 30 second hyperlapse"
sources = ["media.clips", "practice.editing.stabilize"]
must = ["Speed / Duration (clip.speedDuration) to the new length (20× faster)", "Warp Stabilizer with Smooth Motion to steady it (more Smoothness for a glide); auto-scale crops the edges"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr14-hyperlapse-order"
kind = "creative"
family = "hyperlapse-walk"
q = "stabilize before or after speeding up?"
sources = ["practice.editing.stabilize", "media.clips"]
must = ["the stabilizer analyses the clip's camera motion; try it on the sped-up clip and compare with stabilising first (nesting the sped-up clip, clip.nest, is one way to stabilise the result)", "a lower Smoothness if the frame floats"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr14-hyperlapse-blur"
kind = "creative"
family = "hyperlapse-walk"
q = "sped up walk looks jittery and strobey"
sources = ["media.clips", "practice.editing.stabilize"]
must = ["Frame Blending (clip.setTimeInterpolation) mixes neighbouring frames for motion blur", "Warp Stabilizer removes the bounce"]
must_not = []
style = "sloppy"

