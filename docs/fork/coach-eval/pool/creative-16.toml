# --- fake-shallow-focus ---

[[question]]
id = "pool-cr16-bokeh"
kind = "creative"
family = "fake-shallow-focus"
q = "blur the background behind the person like a portrait mode"
sources = ["effects.lens-light", "effects.opacity", "tracking.what"]
must = ["a blurred copy (Gaussian or Bokeh Blur) on top with a mask around the person, Inverted and feathered, tracked as they move", "no depth map: the edge is drawn by hand, so hair is hard"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-bokeh-focus"
kind = "creative"
family = "fake-shallow-focus"
q = "focus pull from one person to another in post"
sources = ["effects.lens-light", "effects.keyframes", "effects.opacity"]
must = ["Focus Blur (or a masked blur) with the sharp area keyframed from one person to the other", "real focus pulls look better; fake ones work on small, slow moves"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr16-bokeh-lights"
kind = "creative"
family = "fake-shallow-focus"
q = "make the city lights behind me into big soft bokeh balls"
sources = ["effects.lens-light", "effects.opacity"]
must = ["Bokeh Blur on a background copy masked off you", "it blurs what's there; small bright lights turn into soft discs"]
must_not = []
style = "sloppy"
