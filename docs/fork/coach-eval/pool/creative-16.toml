# --- fisheye-fix ---

[[question]]
id = "pool-cr16-fisheye"
kind = "creative"
family = "fisheye-fix"
q = "my GoPro footage has curved lines, can I straighten it"
sources = ["effects.lens-light", "practice.mixed-cameras.drone"]
must = ["Lens Distortion (Video Effects ▸ Distort): set Curvature against the bulge until straight lines are straight", "edges stretch or crop; scale up a little to hide them"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-fisheye-add"
kind = "creative"
family = "fisheye-fix"
q = "add a fisheye look for a skate video"
sources = ["effects.lens-light", "effects.apply"]
must = ["Lens Distortion with curvature the other way (or Spherize) bulges the picture", "keep the subject near the centre"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr16-fisheye-match"
kind = "creative"
family = "fisheye-fix"
q = "match an action-cam angle to my main camera in a two-cam edit"
sources = ["practice.mixed-cameras.drone", "effects.lens-light", "color.matching.shot-match"]
must = ["straighten the lens with Lens Distortion first, tame sharpening and saturation", "then match colour to the main camera (Shot Match or by eye on a still)"]
must_not = []
style = "pro"

# --- video-inside-text ---

[[question]]
id = "pool-cr16-inside-text"
kind = "creative"
family = "video-inside-text"
q = "big title where the letters are filled with video"
sources = ["effects.shape-move", "graphics.text"]
must = ["the video on one track and the title above; Track Matte Key (Video Effects ▸ Keying) on the video using the title as its matte (Composite Using alpha)", "turn the title track's output off (timeline.setTrack, enabled false) so only the filled letters show; switching the title clip off instead removes the matte", "bold, wide letters show more of the video"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-inside-text-reverse"
kind = "creative"
family = "video-inside-text"
q = "cut the title out of a black screen so the video shows through the letters"
sources = ["effects.shape-move", "media.generated"]
must = ["a black Color Matte with Track Matte Key using the title, Reverse on, over the video", "turn the title track's output off so it isn't shown; a disabled title clip would stop working as the matte"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr16-inside-text-zoom"
kind = "creative"
family = "video-inside-text"
q = "text filled with footage then zoom through a letter into the scene"
sources = ["effects.shape-move", "effects.keyframes"]
must = ["Track Matte Key with the title as the matte", "keyframe the title's Scale up until a letter fills the frame, then cut or dissolve to the full shot"]
must_not = []
style = "sloppy"

# --- review-copy-timecode ---

[[question]]
id = "pool-cr16-review"
kind = "creative"
family = "review-copy-timecode"
q = "send my client a draft with timecode on screen so they can give notes"
sources = ["practice.workflow.review-copies", "effect-reference.video-transform", "media.generated"]
must = ["Metadata & Timecode Burn-in (Video Effects ▸ Video, Sequence Timecode) on an Adjustment Layer over the whole sequence", "export at a modest bitrate; collect notes as markers"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-review-name"
kind = "creative"
family = "review-copy-timecode"
q = "burn in the clip name too for the assistant to find shots"
sources = ["effect-reference.video-transform", "practice.workflow.review-copies"]
must = ["a second Metadata & Timecode Burn-in set to Clip Name (or File Name), aligned in another corner", "remove or switch them off before the final export"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr16-review-watermark"
kind = "creative"
family = "review-copy-timecode"
q = "draft watermark plus timecode on the review copy"
sources = ["practice.workflow.review-copies", "effects.opacity", "graphics.text"]
must = ["a 'DRAFT' text graphic at low Opacity on the top track", "the timecode burn-in on an adjustment layer; both off for the final"]
must_not = []
style = "sloppy"

