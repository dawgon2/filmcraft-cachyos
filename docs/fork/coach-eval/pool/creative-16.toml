# AI-POOL batch creative-16 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families built on the effect catalogue the guide now names (`effect-reference.*`):
# a lens flare, a mirror / kaleidoscope, a magnifier on a detail, a painted look, light rays, fixing a
# fisheye, video inside text, review copies with timecode, a cut-out sticker look, fake shallow focus.
# `must` = plan sub-goals from the guide's own text (effect names from the effect reference; settings
# only where the guide or the effect's controls name them). Family with a partial gap: painterly-look
# (stylise effects only, no AI style transfer). Held-out only.

# --- lens-flare-sun ---

[[question]]
id = "pool-cr16-flare"
kind = "creative"
family = "lens-flare-sun"
q = "add a lens flare where the sun is in my shot"
sources = ["effects.lens-light", "effects.keyframes", "effects.apply"]
must = ["Lens Flare (Video Effects ▸ Lights & Glows) on the clip, its Flare Center on the sun, Flare Brightness to taste", "if the camera moves, keyframe the Flare Center so it stays on the sun"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-flare-anamorphic"
kind = "creative"
family = "lens-flare-sun"
q = "cinematic flare streak across the frame as a car's headlights pass"
sources = ["effects.lens-light", "effects.keyframes", "effects.opacity"]
must = ["Lens Flare (or a flare overlay clip on Screen) with its centre keyframed along the headlights", "keyframe its brightness up as the lights face the camera and back down"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr16-flare-transition"
kind = "creative"
family = "lens-flare-sun"
q = "flare flash to go between two scenes"
sources = ["effect-reference.transitions", "effects.transitions"]
must = ["a flare / flash transition from Video Transitions ▸ Lights & Blurs (Flare, Flash, Light Leak) on the edit", "it needs handles on both clips"]
must_not = []
style = "sloppy"

# --- mirror-kaleidoscope ---

[[question]]
id = "pool-cr16-mirror"
kind = "creative"
family = "mirror-kaleidoscope"
q = "mirror the shot so the left half is reflected on the right, symmetrical trippy look"
sources = ["effects.lens-light", "effects.apply"]
must = ["the Mirror effect (Video Effects ▸ Distort) reflects the picture along a line you set (centre and angle)", "a centred subject makes the symmetry work"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-kaleido"
kind = "creative"
family = "mirror-kaleidoscope"
q = "kaleidoscope effect for a music video"
sources = ["effect-reference.transitions", "effects.lens-light", "effects.keyframes"]
must = ["the Kaleidoscope transition (Grunge & Distort) gives it between shots; within a shot, stack Mirror effects at different angles", "keyframe the angle for movement"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr16-mirror-flip"
kind = "creative"
family = "mirror-kaleidoscope"
q = "flip a shot left to right to fix screen direction"
sources = ["effects.shape-move", "effects.apply"]
must = ["Horizontal Flip (Video Effects ▸ Transform) on the clip", "watch for text or logos that read backwards"]
must_not = []
style = "pro"

# --- magnifier-detail ---

[[question]]
id = "pool-cr16-magnify"
kind = "creative"
family = "magnifier-detail"
q = "a magnifying glass circle that zooms in on a small detail in the shot"
sources = ["effects.lens-light", "effects.keyframes"]
must = ["the Magnify effect (Video Effects ▸ Distort): shape, centre, magnification, size, feather", "keyframe the centre to move the lens over the picture"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-magnify-screen"
kind = "creative"
family = "magnifier-detail"
q = "zoom bubble on the small text in my screen recording"
sources = ["effects.lens-light", "practice.youtube.screen-recordings"]
must = ["Magnify with a round or square shape on the text, feathered", "or a punch-in with Motion Scale keyframes (eased); record at the size you'll show so text stays sharp"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr16-magnify-border"
kind = "creative"
family = "magnifier-detail"
q = "magnifier with a visible ring around it, like a callout"
sources = ["effects.lens-light", "graphics.layers"]
must = ["Magnify for the zoom", "an ellipse shape layer (stroke only) in a graphic above, matched to the lens, for the ring"]
must_not = []
style = "pro"

# --- painterly-look (partial gap) ---

[[question]]
id = "pool-cr16-paint"
kind = "creative"
family = "painterly-look"
q = "make my video look like an oil painting"
sources = ["effects.painterly", "effects.shape-move", "effects.apply"]
must = ["Brush Strokes (Video Effects ▸ Stylize) for a painted texture; Posterize reduces colours, Roughen Edges for ragged edges", "no AI style transfer: these are filters, so keep them subtle and judge on moving footage"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr16-paint-cartoon"
kind = "creative"
family = "painterly-look"
q = "cartoon look with black outlines"
sources = ["effects.painterly", "effects.opacity"]
must = ["Posterize for flat colour areas", "Find Edges on a copy above with Multiply blend for dark outlines"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr16-paint-sketch"
kind = "creative"
family = "painterly-look"
q = "pencil sketch effect"
sources = ["effects.painterly", "practice.looks.black-white"]
must = ["Find Edges (then Black & White) gives line-drawing edges", "raise contrast so the paper goes white; it is a filter, not a drawing"]
must_not = []
style = "pro"

