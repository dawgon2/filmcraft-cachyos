# --- fake-one-take ---

[[question]]
id = "pool-cr22-oner"
kind = "creative"
family = "fake-one-take"
q = "make several shots look like one continuous take like in 1917"
sources = ["practice.editing.cut-on-action", "effects.opacity", "effects.keyframes"]
must = ["hide each cut where the frame goes dark or something fills it (a wall, a person passing, a whip)", "a mask on the outgoing shot whose edge follows the passing object (keyframed or tracked), or a cut on the darkest frame", "match motion, speed and colour on both sides"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr22-oner-whip"
kind = "creative"
family = "fake-one-take"
q = "hide cuts in whip pans for a fake oner"
sources = ["effects.stylize", "practice.editing.cut-on-action"]
must = ["cut in the middle of the blurred whip on both shots", "the Whip transition over the join if it still jumps"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr22-oner-grade"
kind = "creative"
family = "fake-one-take"
q = "the colour jumps at my hidden cuts"
sources = ["color.matching.shot-match", "color.matching.compare"]
must = ["match the two sides with a still and a wipe, or Shot Match, right at the join", "a short dissolve can blend small remaining differences"]
must_not = []
style = "pro"

# --- actor-plays-two ---

[[question]]
id = "pool-cr22-twins-ots"
kind = "creative"
family = "actor-plays-two"
q = "I play both characters in a conversation scene, how do I edit it"
sources = ["practice.editing.j-l-cuts", "practice.editing.cut-on-action", "practice.editing.clean-plate"]
must = ["shot / reverse shot: film each character's side separately (a double's shoulder for over-the-shoulder), cut between them like a normal conversation, J / L cuts for flow", "for both in one frame: a locked-off split with a mask (clone technique)"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr22-twins-audio"
kind = "creative"
family = "actor-plays-two"
q = "two characters same actor, voices sound identical"
sources = ["effect-reference.audio", "essential-sound.controls"]
must = ["record each with a different delivery; in post a slight Pitch Shifter or EQ difference can separate them", "keep it subtle"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr22-twins-handoff"
kind = "creative"
family = "actor-plays-two"
q = "one character hands the other a cup in the same shot"
sources = ["practice.editing.clean-plate", "effects.opacity", "tracking.what"]
must = ["two locked-off takes with the handoff timed; a split mask between them, its edge animated around the arms during the handoff", "a hard trick: rehearse the timing and use a stand-in"]
must_not = []
style = "pro"

