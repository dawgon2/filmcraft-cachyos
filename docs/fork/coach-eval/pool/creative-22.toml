# AI-POOL batch creative-22 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families: a product turntable, a ripple dream transition, a hologram, 360° video
# (partial), a fake one-take, one actor playing two people, brand colours kept consistent, a screen
# in shot that flickers or glows, grounding a composited object with a shadow, a flickering sign.
# `must` = plan sub-goals from the guide's own text. Family with a partial gap: three-sixty-video
# (immersive effects exist; no guide steps for 360 reframing to a flat cut). Held-out only.

# --- product-turntable ---

[[question]]
id = "pool-cr22-turntable"
kind = "creative"
family = "product-turntable"
q = "product spinning on a turntable, make it loop smoothly for my shop page"
sources = ["effects.transitions", "practice.looks.commercial", "export.presets"]
must = ["cut exactly one full turn so the end matches the start (or dissolve the end into the start)", "clean commercial grade: precise balance, white point near the top without clipping", "a short silent export at the shop's size"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr22-turntable-bg"
kind = "creative"
family = "product-turntable"
q = "turntable shot, the grey backdrop should be pure white"
sources = ["practice.looks.commercial", "color.secondaries.qualifier", "color.finishing.scopes"]
must = ["lift the backdrop to white with a qualifier on its own node (or a soft window), keeping the product's edges", "check on the waveform that the background just reaches white without the product clipping"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr22-turntable-speed"
kind = "creative"
family = "product-turntable"
q = "slow down the turntable spin and keep it smooth"
sources = ["media.clips", "practice.editing.speed-ramp"]
must = ["Speed / Duration slower with Optical Flow (or shoot at a high frame rate)", "optical flow can warp the product's edges; check the loop point again after"]
must_not = []
style = "pro"

# --- ripple-dream-transition ---

[[question]]
id = "pool-cr22-ripple"
kind = "creative"
family = "ripple-dream-transition"
q = "wavy ripple transition into a dream like in old TV shows"
sources = ["effect-reference.video-stylize", "effects.keyframes", "effects.transitions"]
must = ["Wave Warp (Video Effects ▸ Distort) on both sides of the cut, its height keyframed up into the edit and down after", "a Cross Dissolve between the two shots during the wobble"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr22-ripple-adj"
kind = "creative"
family = "ripple-dream-transition"
q = "ripple effect across the cut on one layer instead of each clip"
sources = ["media.generated", "effect-reference.video-stylize", "effects.keyframes"]
must = ["an Adjustment Layer over the edit with Wave Warp (or Turbulent Displace) keyframed", "the dissolve on the clips below"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr22-ripple-sound"
kind = "creative"
family = "ripple-dream-transition"
q = "dream sequence entry with harp sound and wobble"
sources = ["effects.stylize", "essential-sound.types", "effects.transitions"]
must = ["Turbulent Displace (or Wave Warp) keyframed across a dissolve", "a harp gliss on an SFX track timed to the wobble"]
must_not = []
style = "sloppy"

