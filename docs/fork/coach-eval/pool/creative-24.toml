kind = "creative"
family = "title-reflection"
q = "logo reflected in water with ripples"
sources = ["effects.shape-move", "effect-reference.video-stylize", "effects.opacity"]
must = ["a flipped, faded copy of the logo below it", "Wave Warp or Turbulent Displace on the copy for ripples"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr24-reflect-mirror"
kind = "creative"
family = "title-reflection"
q = "mirror the whole shot top to bottom for a lake reflection look"
sources = ["effects.lens-light", "effects.apply"]
must = ["the Mirror effect with its Reflection Angle set to reflect across a horizontal line (Reflection Center on the horizon)", "a little darker and bluer on the reflected half sells water"]
must_not = []
style = "pro"

# --- blue-snow-fix ---

[[question]]
id = "pool-cr24-snow"
kind = "creative"
family = "blue-snow-fix"
q = "snow in my footage looks blue and grey instead of white"
sources = ["color.primaries.white-balance", "color.finishing.scopes", "practice.grading.black-white-points"]
must = ["white balance on the snow (pick it, it should be neutral)", "raise exposure so snow sits near the top of the waveform without clipping the detail"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr24-snow-skin"
kind = "creative"
family = "blue-snow-fix"
q = "fixed the blue snow but now faces are too warm"
sources = ["practice.grading.qualify-skin", "color.primaries.white-balance"]
must = ["balance between: keep the snow slightly cool, or a skin qualifier node to pull faces back", "check skin on the vectorscope"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr24-snow-glare"
kind = "creative"
family = "blue-snow-fix"
q = "bright snow scene clipping on my log footage"
sources = ["color.finishing.soft-clip", "practice.mixed-cameras.overexposed"]
must = ["highlight soft clip / a curve shoulder rolls the snow off smoothly", "clipped areas can't be recovered; keep them white"]
must_not = []
style = "pro"

# --- rec-viewfinder-overlay ---

[[question]]
id = "pool-cr24-rec"
kind = "creative"
family = "rec-viewfinder-overlay"
q = "camcorder viewfinder overlay with a blinking red REC dot and a battery icon"
sources = ["graphics.layers", "effects.keyframes", "effect-reference.video-transform"]
must = ["a graphic with a red circle and 'REC' text, its Opacity keyframed on / off every half second (Hold keyframes)", "corner brackets and a battery as shape layers; Metadata & Timecode Burn-in for running timecode"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr24-rec-blink"
kind = "creative"
family = "rec-viewfinder-overlay"
q = "make the REC dot blink for the whole 2 minutes without hundreds of keyframes"
sources = ["effects.presets", "effects.keyframes"]
must = ["keyframe one blink cycle on a short clip, save as a preset or copy the clip end to end", "or the Strobe Light effect on the dot's layer"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr24-rec-look"
kind = "creative"
family = "rec-viewfinder-overlay"
q = "home video look plus the viewfinder overlay"
sources = ["practice.looks.vhs", "graphics.layers"]
must = ["the VHS shader effect (soft, colour bleed) on the footage", "the viewfinder graphic on a track above so it stays crisp"]
must_not = []
style = "sloppy"

# --- pixel-art-look ---

[[question]]
id = "pool-cr24-pixel"
kind = "creative"
family = "pixel-art-look"
q = "make my video look like an 8-bit video game"
sources = ["tracking.follow", "effects.painterly", "effects.apply"]
must = ["Mosaic on the whole clip for big pixels (Horizontal / Vertical Blocks), Posterize for few colours", "Posterize Time at a low frame rate for choppy game motion; chiptune music"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr24-pixel-title"
kind = "creative"
family = "pixel-art-look"
q = "pixel font title that types in like a retro game"
sources = ["graphics.text", "effects.opacity", "effects.keyframes"]
must = ["a pixel-style font (licensed) in a text graphic", "reveal letters with a mask edge keyframed in steps (Hold keyframes) and a blip sound per step"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr24-pixel-sharp"
kind = "creative"
family = "pixel-art-look"
q = "pixelated look gets blurry when exported"
sources = ["export.bitrate-crf", "export.presets"]
must = ["big flat pixels need a higher bitrate or a quality (CRF) target so edges stay crisp", "export at the sequence's size so the blocks aren't rescaled"]
must_not = []
style = "pro"
