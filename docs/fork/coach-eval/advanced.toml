# Advanced question set for the grading assistant (fork AI-PLAN AI3 item 6; AI3-PREP part 4).
#
# For scoring candidate models + retrieval in AI3: each question names the guide sections a
# correct, grounded answer should come from (`sources`: compact-header ids, docs/guide/README.md
# "Section headers"; any of them counts), facts it must state (`must`) and things it must not do
# (`must_not`, e.g. invent a control or recommend a tool FilmCraft doesn't have as if it did).
#
#   id        stable name
#   kind      node-role | approach | tweak | tool | multi-step | pro-practice | gap
#   q         the question as a user would type it
#   sources   header ids; the answer should cite at least one
#   must      key facts (a reviewer or a keyword check looks for them)
#   must_not  failure modes for this question
#
# The test `advanced_eval_set_is_well_formed` (coach_ask_tests.rs) checks: at least 60 questions,
# unique ids, known kinds, every source id exists, `must` non-empty.

[[question]]
id = "adv-node-order-log"
kind = "node-role"
q = "what order should my nodes go in for F-Log2 footage?"
sources = ["color.nodes.starter-tree", "practice.node-trees.fixed-tree", "practice.grading.balance-first"]
must = ["balance before the look", "the input transform comes first (colour management)", "options, not one right order"]
must_not = ["claims a single correct order", "tells the user to add a CST node by hand"]

[[question]]
id = "adv-why-one-job"
kind = "node-role"
q = "why split a grade into several nodes instead of doing it all on one?"
sources = ["color.nodes.why", "practice.node-trees.fixed-tree"]
must = ["one job per node", "easier to adjust and match later"]
must_not = []

