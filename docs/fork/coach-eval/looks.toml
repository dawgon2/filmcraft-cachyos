# AI4 item 2b acceptance fixtures: synthetic frames for the `needs_clip` questions.
#
# Each `[[look]]` draws a small synthetic frame (display RGB 0..1) that sets up the situation a
# `needs_clip` question is about, and says what a right look at it must mention and must not claim.
# `crates/engine/tests/look_fixtures.rs` renders them, runs a `PictureLooker` with
# `coach_assist::look_prompt(question)`, and scores the reply:
#   - `must`: a list of word groups; the reply names at least one word of every group
#     (case-insensitive, whole words; a group may hold a short phrase);
#   - `must_not`: words whose presence means something was invented (incl. the synthetic training
#     scenes' wording, "backdrop" / "interview" / "table lamp" / "log footage", where the frame has none:
#     tune v1 collapsed onto those templates, 2026-10-16) (a cast the frame doesn't
#     have, a bright frame called dark …).
# The frame: `background` (flat) or `top` / `bottom` (a vertical gradient, `steps` > 1 quantises it
# into visible bands), then `rects` drawn in order ([x, y, w, h] as fractions of the frame), then
# `noise` (± amplitude, deterministic). Synthetic, CPU-only; the real Qwen3-VL score is a PC run.

[[look]]
id = "look-wb-shade"
question = "pool-c2-wb-shade"
background = [0.30, 0.40, 0.58]
rects = [
  { at = [0.08, 0.55, 0.40, 0.22], rgb = [0.78, 0.86, 0.98] }, # the "white" car, gone blue
  { at = [0.0, 0.78, 1.0, 0.22], rgb = [0.22, 0.28, 0.38] },   # road in shade
]
must = [["blue", "bluish", "cool", "cold", "cyan"]]
must_not = ["orange", "warm", "yellow", "tungsten", "backdrop", "interview", "table lamp", "log footage"]

